defaults:
  - pytorch_dataset
  - _self_
  - subsampler: null


dataset_cls: meds_torch.data.components.histogram_pytorch_dataset.HistogramPytorchDataset

token_insertion_strategy: token_count
token_bin_size: 8

augmented_code_metadata_fp: ${data.cache_dir}/codes.parquet

augmented_vocab_size: ${add_two:${data.vocab_size}}
subvocab_size: ${add_two:${get_vocab_size:${data.code_metadata_fp}, ${data.postpend_token}, "code/subvocab_index"}}
