# @package _global_

# to execute this experiment run:

defaults:
  - override /data: histogram_pytorch_dataset
  - override /logger: wandb
  - override /model/backbone: histogram_transformer_decoder
  - override /model/input_encoder: histogram_encoder
  - override /model: histogram_forecasting
  - override /trainer: gpu

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags:
  - "mimiciv"
  - "eic"
  - "transformer_decoder"

seed: 0

trainer:
  min_epochs: 1
  max_epochs: 10
  gradient_clip_val: 1.0
  precision: "16-mixed"

data:
  dataloader:
    batch_size: 32
    num_workers: 6
  max_seq_len: 512
  subsequence_sampling_strategy: "to_end"
  token_bin_size: 8

model:
  token_dim: 768
  optimizer:
    lr: 0.001
  backbone:
    n_layers: 12
    nheads: 12
    dropout: 0
  n_bits: 4
  histogram_batch_mul: 1
  beta: 1e-3


logger:
  wandb:
    tags: ${tags}
    group: "eic_forecast_mtr"

