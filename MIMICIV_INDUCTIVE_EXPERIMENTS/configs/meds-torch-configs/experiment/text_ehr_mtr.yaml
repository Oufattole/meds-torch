# @package _global_

# specify here default configuration
# order of defaults determines the order in which configs override each other
defaults:
  - override /data: multimodal_pytorch_dataset
  - override /logger: wandb
  - override /callbacks: default
  - override /model: multimodal_supervised
  - override /trainer: gpu
  

tags: ["multimodal", "supervised"]

seed: 0

trainer:
  min_epochs: 1
  max_epochs: 10
  gradient_clip_val: 1.0

data:
  dataloader:
    batch_size: 64
    num_workers: 4
  max_seq_len: 128
  collate_type: multimodal
  subsequence_sampling_strategy: to_end

model:
  compile: false
  contrastive_weight: 0.5
  temperature: 0.07
  token_dim: 128
  optimizer:
    lr: 0.001
  backbone:
    n_layers: 2
    nheads: 4
    dropout: 0


logger:
  wandb:
    tags: ${tags}
    group: "multimodal_supervised"
